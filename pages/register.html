<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - Proctectuhq AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            border: 1px solid #333;
            border-radius: 20px;

            font-size: 32px;
        }

        .logo h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .register-box {
            background: #0d0d0d;
            border: 1px solid #292929;
            border-radius: 18px;

            padding: 30px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .register-box h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #ccc;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;

            padding: 14px;

            background: #050505;
            border: 1px solid #333;
            border-radius: 10px;

            color: white;
            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #666;

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        .password-info {
            margin-top: 7px;

            color: #555;
            font-size: 11px;
        }

        .register-button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .register-button:hover {
            background: #ddd;
            transform: translateY(-1px);
        }

        .register-button:active {
            transform: scale(0.98);
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 12px;

            border-radius: 10px;

            background: #171717;
            border: 1px solid #333;

            color: #aaa;
            font-size: 13px;
            text-align: center;
        }

        .login {
            text-align: center;

            margin-top: 22px;

            color: #777;
            font-size: 14px;
        }

        .login a {
            color: white;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;

            margin-top: 25px;

            text-align: center;

            color: #666;
            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <main class="register-container">

        <div class="logo">

            <div class="logo-icon">
                🤖
            </div>

            <h1>Proctectuhq AI</h1>

            <p>Crée ton compte gratuitement</p>

        </div>


        <section class="register-box">

            <h2>Créer un compte</h2>

            <p class="subtitle">
                Rejoins Proctectuhq AI et commence à discuter avec ton IA.
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="username">
                        Nom d'utilisateur
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Ton pseudo"
                        minlength="3"
                        maxlength="30"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ton mot de passe"
                        minlength="8"
                        required
                    >

                    <p class="password-info">
                        Minimum 8 caractères.
                    </p>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Retape ton mot de passe"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    🚀 Créer mon compte
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <p class="login">
                Tu as déjà un compte ?
                <a href="login.html">
                    Se connecter
                </a>
            </p>

        </section>


        <a
            class="back"
            href="../index.html"
        >
            ← Retour à l'accueil
        </a>

    </main>


    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {

                message.textContent =
                    "❌ Les mots de passe ne correspondent pas.";

                message.style.display = "block";

                return;
            }

            message.textContent =
                "✅ Formulaire valide ! Le système de compte sera activé avec le backend.";

            message.style.display = "block";

        });
    </script>

</body>
</html>
