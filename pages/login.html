<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Proctectuhq AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            border: 1px solid #333;
            border-radius: 20px;

            font-size: 32px;
        }

        .logo h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .login-box {
            background: #0d0d0d;
            border: 1px solid #292929;
            border-radius: 18px;

            padding: 30px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .login-box h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #ccc;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;

            padding: 14px;

            background: #050505;
            border: 1px solid #333;
            border-radius: 10px;

            color: white;
            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #666;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        .login-button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #ddd;
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .register {
            text-align: center;

            margin-top: 22px;

            color: #777;
            font-size: 14px;
        }

        .register a {
            color: white;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;

            margin-top: 25px;

            text-align: center;

            color: #666;
            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: white;
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 12px;

            border-radius: 10px;

            background: #171717;
            border: 1px solid #333;

            color: #aaa;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">

            <div class="logo-icon">
                🤖
            </div>

            <h1>Proctectuhq AI</h1>

            <p>Ton intelligence artificielle personnelle</p>

        </div>


        <section class="login-box">

            <h2>Connexion</h2>

            <p class="subtitle">
                Connecte-toi à ton compte Proctectuhq AI.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ton mot de passe"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    🔐 Se connecter
                </button>

            </form>


            <div
                id="message"
                class="message"
            >
                La connexion sera disponible lorsque le serveur sera configuré.
            </div>


            <p class="register">
                Pas encore de compte ?
                <a href="register.html">
                    Créer un compte
                </a>
            </p>

        </section>


        <a
            class="back"
            href="../index.html"
        >
            ← Retour à l'accueil
        </a>

    </main>


    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            message.style.display = "block";

        });
    </script>

</body>
</html>
