<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proctectuhq AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Barre de navigation -->
    <header class="navbar">

        <div class="logo">
            🤖 Proctectuhq AI
        </div>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="pages/about.html">À propos</a>
            <a href="pages/login.html">Connexion</a>
        </nav>

    </header>


    <!-- Contenu principal -->
    <main class="hero">

        <div class="hero-content">

            <div class="ai-icon">
                🤖
            </div>

            <h1>
                Bonjour 👋
            </h1>

            <h2>
                Je suis Proctectuhq AI
            </h2>

            <p>
                Une intelligence artificielle créée pour répondre
                à tes questions, t'aider à coder et discuter avec toi.
            </p>


            <!-- Barre de recherche -->
            <div class="search-box">

                <input
                    id="question"
                    type="text"
                    placeholder="Pose-moi une question..."
                    autocomplete="off"
                >

                <button onclick="startChat()">
                    ➤
                </button>

            </div>


            <!-- Boutons rapides -->
            <div class="quick-actions">

                <button onclick="ask('Aide-moi à coder en Python')">
                    🐍 Coder en Python
                </button>

                <button onclick="ask('Explique-moi quelque chose simplement')">
                    💡 M'expliquer quelque chose
                </button>

                <button onclick="ask('Donne-moi une idée de projet')">
                    🚀 Idée de projet
                </button>

            </div>

        </div>

    </main>


    <!-- Pied de page -->
    <footer>

        <p>
            🖤 Proctectuhq AI • Projet personnel
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
