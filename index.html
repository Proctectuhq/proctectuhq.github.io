<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctectuhq</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 70px;
            margin-bottom: 30px;
        }

        input {
            width: 500px;
            max-width: 80vw;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid #555;
            background: #111;
            color: white;
            font-size: 18px;
            outline: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🔍 Google</h1>

        <input id="search" type="text" placeholder="Rechercher...">

        <br>

        <button onclick="search()">Recherche Google</button>
    </div>

    <script>
        function search() {
            const query = document.getElementById("search").value;

            if (query.trim() !== "") {
                window.location.href =
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(query);
            }
        }
    </script>

</body>
</html>
